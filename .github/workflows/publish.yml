name: Publish to npm

# Fires when you publish a GitHub Release (tag it vX.Y.Z first, e.g. v0.1.0).
# Re-runs the full verify suite before publishing, so a broken build can
# never reach npm even if someone cuts a release by mistake.
#
# Auth is OIDC Trusted Publishing — no NPM_TOKEN secret, nothing to rotate
# or leak, and unaffected by npm's Jan 2027 restriction on 2FA-bypassing
# tokens. This only works once the package exists on the registry AND a
# maintainer has linked it to this exact repo + workflow file at
# https://www.npmjs.com/package/react-inp-chunker/access ("Trusted
# Publisher" section). Until that link is configured, this job will fail
# to authenticate — that's expected, not a workflow bug.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Trusted Publishing needs a recent npm CLI (>=11.5.1); pin newer
      # rather than trust whatever setup-node's Node version happens to bundle.
      - run: npm install -g npm@latest
      - name: Full verify (lint, types, 100% coverage, build, size)
        run: npm run verify
      - name: Publish (OIDC — no token)
        run: npm publish --provenance --access public
