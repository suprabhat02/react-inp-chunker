name: Deploy demo

# Pushes to main that touch demo/ redeploy it to GitHub Pages at
# https://suprabhat02.github.io/react-inp-chunker/ — no custom domain
# (public/CNAME was deliberately removed; see commit history for why).
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      # The demo installs react-inp-chunker from the registry like any
      # real consumer would (see demo/package.json) — it is deliberately
      # not wired to the local workspace build, so this demo always
      # reflects what's actually published, not what's on disk.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
