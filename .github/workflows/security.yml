name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after a release is still found
    # while nobody is touching the repository.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Dependencies and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Development dependencies count: they run in CI with access to the
      # repository, and they build what gets published.
      - name: Known vulnerabilities (production and development)
        run: npm audit --audit-level=low
      - name: Known vulnerabilities in the pinned compat toolchains
        run: |
          for directory in compat/react18 compat/typescript5 compat/typescript7; do
            npm ci --prefix "$directory" --ignore-scripts
            npm audit --prefix "$directory" --audit-level=low
          done
      # Every installed package matches the registry's signature, so a
      # tampered tarball fails here rather than in a build.
      - name: Registry signatures
        run: npm audit signatures

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a pull request has a base to compare against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Blocks a pull request that introduces a vulnerable dependency, or
      # one under a licence this project cannot ship.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later
